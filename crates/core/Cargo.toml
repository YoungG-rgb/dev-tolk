[package]
name = "tolk-core"
description = "Ядро dev-tolk без UI: каталог данных, SQLite, очередь заданий"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
docx-rs = "0.4"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["native-tls", "system-proxy", "blocking"] }
fs4 = "1"
libc = "0.2"
keepawake = { version = "0.6", default-features = false }
log = "0.4"
rusqlite = { version = "0.40", features = ["bundled"] }
thiserror = "2"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
roxmltree = "0.20"
zip = { version = "2", default-features = false, features = ["deflate"] }
