name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Новый запуск на той же ветке отменяет предыдущий.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# Что проверено локально, а что нет (2026-10-18):
# - шаги macOS прогнаны вручную на чистой копии репозитория на H2 (см. docs/TASKS.md, MVP-026);
# - ветки Windows на CI не запускались ни разу, код на Windows не компилировался. Поэтому у Windows стоит
#   `continue-on-error: true`: красная Windows не скрывает результат macOS, но и не считается подтверждённой.
#   Когда Windows пройдёт, флаг нужно снять.
jobs:
  engine:
    name: Ядро и движок (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            experimental: false
          - os: windows-latest
            experimental: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Путь к libclang (whisper-rs, Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "LIBCLANG_PATH=C:\\Program Files\\LLVM\\bin" >> "$GITHUB_ENV"
      - run: cargo fmt --all --check
      - run: cargo clippy -p tolk-engine -p tolk-core --all-targets -- -D warnings
      - run: cargo build -p tolk-engine --release
      # Тесты с настоящими моделями и `say` пропускаются сами: моделей на CI нет.
      - run: cargo test -p tolk-engine -p tolk-core

  # Тесты движка и очереди с настоящей моделью (small-q5_1, 181 МБ) и моделью определения речи. Модели
  # кэшируются по хэшу каталога. Не проверялся на CI ни разу (локально те же тесты проходят с этими моделями):
  # на виртуальной машине может не быть GPU (движок тогда работает на CPU) и голоса `say`
  # (тесты с синтезом речи пропускаются сами). Пока `continue-on-error`.
  engine-model:
    name: Движок с моделью (macos-15)
    runs-on: macos-15
    continue-on-error: true
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/models
          key: models-small-q5_1-${{ hashFiles('crates/core/catalog/models.json') }}
      - name: Модели для тестов
        run: python3 bench/fetch_models.py small-q5_1 silero-vad-v6.2.0 --yes --dir "${{ runner.temp }}/models"
      - run: cargo build -p tolk-engine --release
      # Диагностика: как движок ведёт себя на виртуальной машине (GPU, скорость). Вывод stderr движка в журнале.
      - name: Движок на коротком звуке (с GPU и без)
        continue-on-error: true
        env:
          MODELS: ${{ runner.temp }}/models
        run: |
          say -o "$RUNNER_TEMP/s.aiff" "This is a short test of speech recognition on the continuous integration runner. It has two sentences."
          python3 - <<'PY'
          import os, subprocess, time
          m = os.environ["MODELS"]; t = os.environ["RUNNER_TEMP"]
          for flag in ([], ["--no-gpu"]):
              cmd = ["target/release/tolk-engine", "transcribe", "--model", f"{m}/ggml-small-q5_1.bin", "--vad-model", f"{m}/ggml-silero-v6.2.0.bin",
                     "--input", f"{t}/s.aiff", "--output", f"{t}/o.json", *flag]
              t0 = time.time()
              try:
                  r = subprocess.run(cmd, capture_output=True, text=True, timeout=150)
                  print("флаги", flag, "код", r.returncode, f"{time.time() - t0:.1f} с")
                  print(r.stdout[-600:]); print(r.stderr[-1500:])
              except subprocess.TimeoutExpired as e:
                  print("флаги", flag, "ТАЙМАУТ 150 с"); print((e.stderr or b"")[-1500:])
          PY
      # На виртуальных машинах macOS «Apple Paravirtual device» принимается за GPU и работает на порядки медленнее
      # CPU (первый прогон: тесты с настоящим движком шли 691 с и упирались в таймаут), поэтому CPU.
      - run: cargo test -p tolk-engine -p tolk-core
        env:
          TOLK_TEST_MODELS: ${{ runner.temp }}/models
          TOLK_NO_GPU: "1"

  app:
    name: Приложение (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            bundles: app
            experimental: false
          - os: windows-latest
            bundles: nsis
            experimental: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Путь к libclang (whisper-rs, Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "LIBCLANG_PATH=C:\\Program Files\\LLVM\\bin" >> "$GITHUB_ENV"
      # В package-lock.json должны быть только публичные адреса пакетов. Первый прогон CI упал на `npm ci`
      # («Exit handler never called»): адреса указывали на корпоративный реестр, недоступный с GitHub.
      # npm подставляет настроенный реестр вместо registry.npmjs.org сам (`replace-registry-host`).
      - name: Проверка адресов пакетов в package-lock.json
        shell: bash
        run: |
          bad="$(grep -o '"resolved": "https\?://[^/]*' app/package-lock.json | grep -v 'registry.npmjs.org' || true)"
          if [ -n "$bad" ]; then echo "Адреса не из registry.npmjs.org:"; echo "$bad" | sort | uniq -c; exit 1; fi
      - name: Зависимости и проверка фронтенда
        working-directory: app
        run: |
          npm ci
          npm run check
          npm run build
      # Сайдкар и модель определения речи для ресурсов приложения (модель скачивается с закреплённого адреса
      # каталога, SHA-256 проверяется). Без этого tauri-build не находит externalBin и resources.
      - name: Сайдкар и ресурсы
        shell: bash
        run: tools/prepare-sidecar.sh
      - run: cargo clippy -p tolk-app --all-targets -- -D warnings
      - name: Сборка неподписанного приложения
        working-directory: app
        run: npx tauri build --bundles ${{ matrix.bundles }}
      - name: Упаковка .app (сохраняет права и подпись)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent target/release/bundle/macos/dev-tolk.app dev-tolk-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: tolk-app-${{ matrix.os }}
          path: |
            target/release/bundle/nsis/*.exe
            dev-tolk-macos.zip
          if-no-files-found: error

  bench-tools:
    name: Инструменты бенчмарка (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - working-directory: bench
        run: python -m unittest discover -s tests

  licenses:
    name: Лицензии зависимостей
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny check licenses bans sources
