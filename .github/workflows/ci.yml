name: CI

on:
  push:
  pull_request:

jobs:
  engine:
    name: Ядро и движок (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy -p tolk-engine -p tolk-core --all-targets -- -D warnings
      - run: cargo build -p tolk-engine --release
      - run: cargo test -p tolk-engine -p tolk-core

  app:
    name: Приложение (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          - os: macos-15
            bundles: app
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Зависимости и проверка фронтенда
        working-directory: app
        run: |
          npm ci
          npm run check
          npm run build
      - name: Сайдкар (tolk-engine для externalBin)
        shell: bash
        run: tools/prepare-sidecar.sh
      - run: cargo clippy -p tolk-app --all-targets -- -D warnings
      - name: Сборка неподписанного приложения
        working-directory: app
        run: npx tauri build --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: tolk-app-${{ matrix.os }}
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/macos/*.app
          if-no-files-found: error

  licenses:
    name: Лицензии зависимостей
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny check licenses bans sources
